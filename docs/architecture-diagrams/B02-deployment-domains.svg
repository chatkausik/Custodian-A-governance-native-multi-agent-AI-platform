"round" marker-end="url(#arrow-plain)" stroke-dasharray="8 6"/><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Six Compose layers organize the local service estate</tspan></text><rect x="40" y="115" width="450" height="170" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="58" y="147" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="58" dy="0">Base layer</tspan></text><text x="58" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Postgres</tspan><tspan x="58" dy="25.0">MinIO and initialization</tspan></text><rect x="575" y="115" width="450" height="170" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="593" y="147" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="593" dy="0">Identity layer</tspan></text><text x="593" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="593" dy="0">Keycloak and SPIRE</tspan><tspan x="593" dy="25.0">Infisical and Redis</tspan></text><rect x="1110" y="115" width="450" height="170" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1128" y="147" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1128" dy="0">Data layer</tspan></text><text x="1128" y="178" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1128" dy="0">OpenMetadata service family</tspan><tspan x="1128" dy="25.0">Presidio pair and data loader</tspan></text><rect x="40" y="500" width="450" height="170" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="58" y="532" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="58" dy="0">Model layer</tspan></text><text x="58" y="563" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">LiteLLM and Redis</tspan><tspan x="58" dy="25.0">MLflow and DeepEval gate</tspan></text><rect x="575" y="500" width="450" height="170" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="593" y="532" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="593" dy="0">Application layer</tspan></text><text x="593" y="563" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="593" dy="0">Backend, console and ledger</tspan><tspan x="593" dy="25.0">Policy, audit, control, OCR runner</tspan></text><rect x="1110" y="500" width="450" height="170" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="1128" y="532" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="1128" dy="0">Observability layer</tspan></text><text x="1128" y="563" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1128" dy="0">Langfuse service family</tspan><tspan x="1128" dy="25.0">Prometheus and Grafana</tspan></text><rect x="350" y="355" width="900" height="78" rx="12" fill="#F3F5F7" stroke="#687788" stroke-width="2"/><text x="368" y="387" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#687788" text-anchor="start"><tspan x="368" dy="0">custodian-net</tspan></text><text x="368" y="418" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="368" dy="0"></tspan></text><rect x="42" y="704" width="1515" height="76" rx="8" fill="#F3F5F7"/><text x="58" y="732" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#687788" text-anchor="start"><tspan x="58" dy="0">Supporting databases, caches and volumes belong to their respective service groups. Network membership does not prove every pair</tspan><tspan x="58" dy="25.0">communicates.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>