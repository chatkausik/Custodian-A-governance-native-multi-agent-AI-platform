h d="M 705,630 L 705,670 L 1575,670 L 1575,305 L 1380,305 L 1380,260" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1156.0" y="634" width="88" height="26" rx="5" fill="white"/><text x="1200" y="654" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="1200" dy="0">approve</tspan></text><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Routing follows the current LangGraph definition</tspan></text><rect x="40" y="125" width="260" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="58" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="58" dy="0">Extraction</tspan></text><text x="58" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Guardrail and</tspan><tspan x="58" dy="25.0">redaction</tspan><tspan x="58" dy="25.0">Typed invoice fields</tspan></text><rect x="415" y="125" width="275" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="433" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="433" dy="0">Risk scoring</tspan></text><text x="433" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="433" dy="0">Vendor history lookup</tspan><tspan x="433" dy="25.0">Risk decision</tspan></text><rect x="815" y="125" width="285" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="833" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="833" dy="0">Approval</tspan></text><text x="833" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="833" dy="0">Confidence and critic</tspan><tspan x="833" dy="25.0">Capability and policy</tspan></text><rect x="1220" y="125" width="325" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="1238" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="1238" dy="0">Payment execution</tspan></text><text x="1238" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1238" dy="0">Dry run, hold, commit</tspan><tspan x="1238" dy="25.0">Vendor history update</tspan></text><rect x="40" y="475" width="260" height="130" rx="12" fill="#FFF0EE" stroke="#B94B46" stroke-width="2"/><text x="58" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B94B46" text-anchor="start"><tspan x="58" dy="0">Failed</tspan></text><text x="58" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Unsafe input blocked</tspan></text><rect x="490" y="475" width="440" height="155" rx="12" fill="#FFF4E4" stroke="#B66D12" stroke-width="2"/><text x="508" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B66D12" text-anchor="start"><tspan x="508" dy="0">Human review</tspan></text><text x="508" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="508" dy="0">Checkpointed interrupt</tspan><tspan x="508" dy="25.0">Approve or reject</tspan><tspan x="508" dy="25.0">Resume with a decision</tspan></text><rect x="1220" y="475" width="325" height="130" rx="12" fill="#FFF0EE" stroke="#B94B46" stroke-width="2"/><text x="1238" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B94B46" text-anchor="start"><tspan x="1238" dy="0">Rejected</tspan></text><text x="1238" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1238" dy="0">No payment execution</tspan></text><rect x="40" y="705" width="1515" height="50" rx="8" fill="#FFF4E4"/><text x="56" y="733" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B66D12" text-anchor="start"><tspan x="56" dy="0">Approval confidence below 0.75 requires human review. Extraction confidence is a different signal.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>