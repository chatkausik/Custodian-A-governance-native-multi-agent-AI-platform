<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><path d="M 300,190 L 415,190" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="329.0" y="147" width="58" height="26" rx="5" fill="white"/><text x="358" y="167" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="358" dy="0">safe</tspan></text><path d="M 690,190 L 815,190" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="702.0" y="147" width="98" height="26" rx="5" fill="white"/><text x="751" y="167" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="751" dy="0">continue</tspan></text><path d="M 1100,190 L 1220,190" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="1111.0" y="147" width="98" height="26" rx="5" fill="white"/><text x="1160" y="167" font-family="Arial, sans-serif" f