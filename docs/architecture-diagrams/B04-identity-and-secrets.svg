<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><rect x="35" y="100" width="720" height="270" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="55" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="55" dy="0">IDENTITY AT THE APPLICATION BOUNDARY</tspan></text><rect x="825" y="100" width="740" height="270" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="845" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="845" dy="0">FOUR AGENTS SHARE THE BACKEND PROCESS</tspan></text><path d="M 360,545 L 485,545" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="351.0" y="500" width="148" height="26" rx="5" fill="white"/><text x="425" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="425" dy="0">login / fetch</tspan></text><path d="M 785,545 L 950,545" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="799.0" y="500" width="138" height="26" rx="5" fill="white"/><text x="868" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="868" dy="0">fresh secret</tspan></text><path d="M 1240,545 L 1305,545" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Human login, workload identity and payment credentials are separate paths</tspan></text><rect x="65" y="165" width="280" height="135" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="83" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="83" dy="0">Finance user</tspan></text><text x="83" y="228" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="83" dy="0">Keycloak login</tspan><tspan x="83" dy="25.0">Human role</tspan></text><rect x="430" y="165" width="285" height="135" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="448" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="448" dy="0">Backend process</tspan></text><text x="448" y="228" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="448" dy="0">Fetch SPIRE X.509 SVID</tspan><tspan x="448" dy="25.0">At module import</tspan></text><rect x="865" y="165" width="655" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="883" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="883" dy="0">Node privilege separation</tspan></text><text x="883" y="228" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="883" dy="0">Extraction | Risk | Approval | Payment</tspan><tspan x="883" dy="25.0">Capability manifests and Cedar policies</tspan></text><rect x="40" y="470" width="320" height="155" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="58" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="58" dy="0">Payment path</tspan></text><text x="58" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Narrow machine identity</tspan><tspan x="58" dy="25.0">Universal Auth client</tspan><tspan x="58" dy="25.0">Credentials from</tspan><tspan x="58" dy="25.0">environment</tspan></text><rect x="485" y="470" width="300" height="155" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="503" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="503" dy="0">Infisical</tspan></text><text x="503" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="503" dy="0">Authenticate or reuse</tspan><tspan x="503" dy="25.0">token</tspan><tspan x="503" dy="25.0">Fetch LEDGER_API_KEY</tspan></text><rect x="950" y="470" width="290" height="155" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="968" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="968" dy="0">Ledger request</tspan></text><text x="968" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="968" dy="0">Bearer API key</tspan><tspan x="968" dy="25.0">Dry run or commit</tspan><tspan x="968" dy="25.0">Discard local key</tspan><tspan x="968" dy="25.0">reference</tspan></text><rect x="1305" y="470" width="255" height="155" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1323" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1323" dy="0">Ledger response</tspan></text><text x="1323" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1323" dy="0">Validation result or</tspan><tspan x="1323" dy="25.0">Transaction result</tspan></text><rect x="42" y="695" width="1515" height="50" rx="8" fill="#FFF4E4"/><text x="58" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B66D12" text-anchor="start"><tspan x="58" dy="0">Identity limit: the four graph nodes do not have four independently attested SPIRE workload identities.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>