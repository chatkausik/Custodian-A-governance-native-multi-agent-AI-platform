" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="448" dy="0">Presidio</tspan></text><text x="448" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="448" dy="0">Analyze and anonymize</tspan><tspan x="448" dy="25.0">Redacted audit text</tspan></text><rect x="850" y="470" width="300" height="155" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="868" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="868" dy="0">Audit trail in state</tspan></text><text x="868" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="868" dy="0">PII scan result</tspan><tspan x="868" dy="25.0">Agent steps and outcomes</tspan></text><rect x="1260" y="470" width="300" height="155" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1278" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1278" dy="0">Postgres checkpoints</tspan></text><text x="1278" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1278" dy="0">Durable graph state</tspan><tspan x="1278" dy="25.0">Includes raw input</tspan></text><rect x="40" y="465" width="285" height="165" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="58" y="497" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="58" dy="0">Image persistence</tspan></text><text x="58" y="528" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Upload saved in shared</tspan><tspan x="58" dy="25.0">invoice-images volume</tspan><tspan x="58" dy="25.0">Before OCR processing</tspan></text><rect x="42" y="695" width="1515" height="76" rx="8" fill="#FFF0EE"/><text x="58" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B94B46" text-anchor="start"><tspan x="58" dy="0">Outage behavior: the redaction helper returns original text if a Presidio request fails. Raw input retention and checkpoint access require</tspan><tspan x="58" dy="25.0">explicit review.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>