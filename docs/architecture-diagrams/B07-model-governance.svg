<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><rect x="35" y="105" width="940" height="545" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="55" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="55" dy="0">INFERENCE THROUGH LITELLM</tspan></text><rect x="1015" y="105" width="550" height="545" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="1035" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="1035" dy="0">PROMPT LIFECYCLE</tspan></text><path d="M 415,242 L 530,242" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 720,315 L 720,370 L 198,370 L 198,445" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 720,315 L 720,370 L 502,370 L 502,445" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 720,315 L 720,370 L 810,370 L 810,445" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 1290,285 L 1290,350" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1306.0" y="312" width="98" height="26" rx="5" fill="white"/><text x="1355" y="332" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="1355" dy="0">DeepEval</tspan></text><path d="M 1290,480 L 1290,535" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1306.0" y="496" width="88" height="26" rx="5" fill="white"/><text x="1350" y="516" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="1350" dy="0">promote</tspan></text><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">The gateway controls routes and budgets; the registry controls prompt selection</tspan></text><rect x="65" y="170" width="350" height="145" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="83" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="83" dy="0">Agent calls</tspan></text><text x="83" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="83" dy="0">Instructor typed responses</tspan><tspan x="83" dy="25.0">Per agent virtual keys</tspan></text><rect x="530" y="170" width="390" height="145" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="548" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="548" dy="0">LiteLLM gateway</tspan></text><text x="548" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="548" dy="0">Model scope and spend caps</tspan><tspan x="548" dy="25.0">Three named routes</tspan></text><rect x="65" y="445" width="265" height="150" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="83" y="477" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="83" dy="0">Routine</tspan></text><text x="83" y="508" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="83" dy="0">Groq gpt-oss</tspan><tspan x="83" dy="25.0">Extraction and critic</tspan></text><rect x="365" y="445" width="275" height="150" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="383" y="477" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="383" dy="0">Reasoning</tspan></text><text x="383" y="508" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="383" dy="0">OpenAI route</tspan><tspan x="383" dy="25.0">Approval and high</tspan><tspan x="383" dy="25.0">amounts</tspan></text><rect x="675" y="445" width="270" height="150" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="693" y="477" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="693" dy="0">Guardrail</tspan></text><text x="693" y="508" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="693" dy="0">Groq safeguard</tspan><tspan x="693" dy="25.0">Content safety</tspan><tspan x="693" dy="25.0">decision</tspan></text><rect x="1050" y="160" width="480" height="125" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1068" y="192" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1068" dy="0">Held out invoice fields</tspan></text><text x="1068" y="223" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1068" dy="0">Evaluate prompt against ground truth</tspan></text><rect x="1050" y="350" width="480" height="130" rx="12" fill="#FFF4E4" stroke="#B66D12" stroke-width="2"/><text x="1068" y="382" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B66D12" text-anchor="start"><tspan x="1068" dy="0">Promotion decision</tspan></text><text x="1068" y="413" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1068" dy="0">Accuracy at least 0.60: production alias</tspan><tspan x="1068" dy="25.0">Below threshold: blocked</tspan></text><rect x="1050" y="535" width="480" height="95" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="1068" y="567" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="1068" dy="0">MLflow production prompt</tspan></text><text x="1068" y="598" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1068" dy="0"></tspan></text><rect x="42" y="695" width="1515" height="76" rx="8" fill="#FFF4E4"/><text x="58" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B66D12" text-anchor="start"><tspan x="58" dy="0">Extraction loads the production prompt once at startup. If loading fails, the code uses a local fallback prompt. A newly promoted prompt</tspan><tspan x="58" dy="25.0">needs a backend restart.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>