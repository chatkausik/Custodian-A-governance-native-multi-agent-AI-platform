<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><path d="M 360,198 L 435,198" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 755,198 L 835,198" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 1155,198 L 1240,198" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 1400,270 L 1400,475" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1406.0" y="360" width="68" height="26" rx="5" fill="white"/><text x="1440" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="1440" dy="0">clear</tspan></text><path d="M 1240,550 L 1155,550" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="1144.0" y="507" width="108" height="26" rx="5" fill="white"/><text x="1198" y="527" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="1198" dy="0">committed</tspan></text><path d="M 835,550 L 755,550" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="746.0" y="507" width="98" height="26" rx="5" fill="white"/><text x="795" y="527" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="795" dy="0">recorded</tspan></text><path d="M 595,270 L 595,350 L 200,350 L 200,475" fill="none" stroke="#B94B46" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-risk)"/><rect x="321.0" y="311" width="88" height="26" rx="5" fill="white"/><text x="365" y="331" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#B94B46" text-anchor="middle"><tspan x="365" dy="0">invalid</tspan></text><path d="M 1400,270 L 1400,400 L 295,400 L 295,475" fill="none" stroke="#B94B46" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-risk)"/><rect x="846.0" y="363" width="128" height="26" rx="5" fill="white"/><text x="910" y="383" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#B94B46" text-anchor="middle"><tspan x="910" dy="0">stop active</tspan></text><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Validation occurs before the hold and again during the real commit</tspan></text><rect x="40" y="125" width="320" height="145" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="58" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="58" dy="0">Authorized payment</tspan></text><text x="58" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Capability and policy</tspan><tspan x="58" dy="25.0">Build balanced entries</tspan></text><rect x="435" y="125" width="320" height="145" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="453" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="453" dy="0">Ledger dry run</tspan></text><text x="453" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="453" dy="0">Validate accounts and</tspan><tspan x="453" dy="25.0">funds</tspan><tspan x="453" dy="25.0">Rollback without writes</tspan></text><rect x="835" y="125" width="320" height="145" rx="12" fill="#FFF4E4" stroke="#B66D12" stroke-width="2"/><text x="853" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B66D12" text-anchor="start"><tspan x="853" dy="0">Settlement hold</tspan></text><text x="853" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="853" dy="0">Wait configured interval</tspan><tspan x="853" dy="25.0">Default 20 seconds</tspan></text><rect x="1240" y="125" width="320" height="145" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="1258" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="1258" dy="0">Recheck stop state</tspan></text><text x="1258" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1258" dy="0">Global, agent, session</tspan><tspan x="1258" dy="25.0">And frozen tool state</tspan></text><rect x="1240" y="475" width="320" height="155" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1258" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1258" dy="0">Real ledger commit</tspan></text><text x="1258" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1258" dy="0">Revalidate under row locks</tspan><tspan x="1258" dy="25.0">Check duplicate key</tspan><tspan x="1258" dy="25.0">Commit transaction</tspan></text><rect x="835" y="475" width="320" height="155" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="853" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="853" dy="0">Vendor history</tspan></text><text x="853" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="853" dy="0">Record settled payment</tspan><tspan x="853" dy="25.0">Used by later risk lookups</tspan></text><rect x="435" y="475" width="320" height="155" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="453" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="453" dy="0">Settled run</tspan></text><text x="453" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="453" dy="0">Return transaction ID</tspan><tspan x="453" dy="25.0">Update terminal state</tspan></text><rect x="40" y="475" width="320" height="155" rx="12" fill="#FFF0EE" stroke="#B94B46" stroke-width="2"/><text x="58" y="507" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B94B46" text-anchor="start"><tspan x="58" dy="0">Blocked outcomes</tspan></text><text x="58" y="538" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Invalid dry run</tspan><tspan x="58" dy="25.0">Stop flag or duplicate key</tspan></text><rect x="42" y="696" width="1515" height="76" rx="8" fill="#FFF4E4"/><text x="58" y="724" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B66D12" text-anchor="start"><tspan x="58" dy="0">Dry run does not reserve funds across the hold and does not check duplicate keys. Commit performs real validation. A control-plane outage</tspan><tspan x="58" dy="25.0">currently returns an all-clear status.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>