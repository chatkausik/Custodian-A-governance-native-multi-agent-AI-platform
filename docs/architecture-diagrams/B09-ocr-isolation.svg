<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><rect x="375" y="340" width="1185" height="325" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="395" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="395" dy="0">FRESH OCR WORKER CONTAINER</tspan></text><path d="M 325,200 L 425,200" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="321.0" y="154" width="108" height="26" rx="5" fill="white"/><text x="375" y="174" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="375" dy="0">POST /ocr</tspan></text><path d="M 775,200 L 1040,200" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="854.0" y="154" width="108" height="26" rx="5" fill="white"/><text x="908" y="174" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="908" dy="0">authorize</tspan></text><path d="M 595,270 L 595,410" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="616.0" y="325" width="68" height="26" rx="5" fill="white"/><text x="650" y="345" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="650" dy="0">spawn</tspan></text><path d="M 735,498 L 825,498" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="731.0" y="455" width="98" height="26" rx="5" fill="white"/><text x="780" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="780" dy="0">restrict</tspan></text><path d="M 1150,498 L 1230,498" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="1146.0" y="455" width="88" height="26" rx="5" fill="white"/><text x="1190" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="1190" dy="0">execute</tspan></text><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Image processing crosses a runner boundary and a fresh worker boundary</tspan></text><rect x="35" y="130" width="290" height="140" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="53" y="162" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="53" dy="0">Backend upload</tspan></text><text x="53" y="193" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="53" dy="0">Write image to shared</tspan><tspan x="53" dy="25.0">invoice-images volume</tspan></text><rect x="425" y="130" width="350" height="140" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="443" y="162" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="443" dy="0">Sandbox runner</tspan></text><text x="443" y="193" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="443" dy="0">Authorize sandbox-ocr tool</tspan><tspan x="443" dy="25.0">Create worker and scratch</tspan></text><rect x="1040" y="130" width="470" height="140" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="1058" y="162" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="1058" dy="0">Policy service</tspan></text><text x="1058" y="193" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1058" dy="0">InvokeTool authorization</tspan><tspan x="1058" dy="25.0">Request failure denies spawn</tspan></text><rect x="410" y="410" width="325" height="175" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="428" y="442" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="428" dy="0">Docker restrictions</tspan></text><text x="428" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="428" dy="0">No network | UID 10001</tspan><tspan x="428" dy="25.0">Read only root | Drop ALL</tspan><tspan x="428" dy="25.0">caps</tspan><tspan x="428" dy="25.0">256 MB | 0.5 CPU | 30 s</tspan></text><rect x="825" y="410" width="325" height="175" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="843" y="442" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="843" dy="0">Landlock boundary</tspan></text><text x="843" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="843" dy="0">Read /input</tspan><tspan x="843" dy="25.0">Write /scratch</tspan><tspan x="843" dy="25.0">Apply before OCR worker</tspan></text><rect x="1230" y="410" width="285" height="175" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1248" y="442" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1248" dy="0">OCR result</tspan></text><text x="1248" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1248" dy="0">Tesseract output</tspan><tspan x="1248" dy="25.0">Return text to backend</tspan><tspan x="1248" dy="25.0">Remove scratch volume</tspan></text><rect x="40" y="395" width="265" height="210" rx="12" fill="#FFF0EE" stroke="#B94B46" stroke-width="2"/><text x="58" y="427" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B94B46" text-anchor="start"><tspan x="58" dy="0">Privileged</tspan><tspan x="58" dy="28.75">boundary</tspan></text><text x="58" y="485" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Runner mounts</tspan><tspan x="58" dy="25.0">docker.sock</tspan><tspan x="58" dy="25.0">Worker does not</tspan><tspan x="58" dy="25.0">Review runner</tspan><tspan x="58" dy="25.0">exposure</tspan></text><rect x="42" y="695" width="1515" height="76" rx="8" fill="#FFF0EE"/><text x="58" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B94B46" text-anchor="start"><tspan x="58" dy="0">If Landlock is unavailable, the OCR entrypoint exits instead of executing the worker unsandboxed. The source report records image intake as</tspan><tspan x="58" dy="25.0">unavailable on its test host.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>