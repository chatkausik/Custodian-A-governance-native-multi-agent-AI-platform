<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><path d="M 315,192 L 420,192" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 740,192 L 850,192" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 1160,192 L 1260,192" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><path d="M 1410,265 L 1410,460" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1326.0" y="345" width="188" height="26" rx="5" fill="white"/><text x="1420" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="1420" dy="0">manual / watchdog</tspan></text><path d="M 1260,540 L 1160,540" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="1171.0" y="494" width="78" height="26" rx="5" fill="white"/><text x="1210" y="514" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="1210" dy="0">result</tspan></text><path d="M 850,540 L 740,540" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="726.0" y="494" width="138" height="26" rx="5" fill="white"/><text x="795" y="514" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="795" dy="0">state change</tspan></text><path d="M 420,540 L 315,540" fill="none" stroke="#7251A1" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-data)"/><rect x="329.0" y="494" width="78" height="26" rx="5" fill="white"/><text x="368" y="514" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#7251A1" text-anchor="middle"><tspan x="368" dy="0">manual</tspan></text><path d="M 580,460 L 580,360 L 178,360 L 178,265" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="300.0" y="318" width="168" height="26" rx="5" fill="white"/><text x="384" y="338" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="384" dy="0">new audit event</tspan></text><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Hash chaining and two storage representations support integrity checks</tspan></text><rect x="40" y="120" width="275" height="145" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="58" y="152" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="58" dy="0">Audit event</tspan></text><text x="58" y="183" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Event type and payload</tspan><tspan x="58" dy="25.0">Source service</tspan></text><rect x="420" y="120" width="320" height="145" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="438" y="152" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="438" dy="0">Build chain entry</tspan></text><text x="438" y="183" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="438" dy="0">Read previous hash</tspan><tspan x="438" dy="25.0">Canonical JSON and SHA-256</tspan></text><rect x="850" y="120" width="310" height="145" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="868" y="152" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="868" dy="0">Write MinIO object</tspan></text><text x="868" y="183" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="868" dy="0">Store canonical entry</tspan><tspan x="868" dy="25.0">Use bucket retention</tspan><tspan x="868" dy="25.0">policy</tspan></text><rect x="1260" y="120" width="300" height="145" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1278" y="152" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1278" dy="0">Commit Postgres row</tspan></text><text x="1278" y="183" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1278" dy="0">Store hashes, payload</tspan><tspan x="1278" dy="25.0">And object key</tspan></text><rect x="1260" y="460" width="300" height="160" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="1278" y="492" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="1278" dy="0">Verify entries</tspan></text><text x="1278" y="523" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1278" dy="0">Recompute hash and links</tspan><tspan x="1278" dy="25.0">Compare current object</tspan><tspan x="1278" dy="25.0">bytes</tspan></text><rect x="850" y="460" width="310" height="160" rx="12" fill="#FFF4E4" stroke="#B66D12" stroke-width="2"/><text x="868" y="492" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#B66D12" text-anchor="start"><tspan x="868" dy="0">Integrity result</tspan></text><text x="868" y="523" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="868" dy="0">No breaks: valid</tspan><tspan x="868" dy="25.0">Mismatch or missing:</tspan><tspan x="868" dy="25.0">break</tspan></text><rect x="420" y="460" width="320" height="160" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="438" y="492" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="438" dy="0">Watchdog event</tspan></text><text x="438" y="523" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="438" dy="0">Append tamper_detected</tspan><tspan x="438" dy="25.0">Append tamper_resolved</tspan></text><rect x="40" y="460" width="275" height="160" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="58" y="492" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="58" dy="0">Operator recovery</tspan></text><text x="58" y="523" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="58" dy="0">Restore locked version</tspan><tspan x="58" dy="25.0">Detection history</tspan><tspan x="58" dy="25.0">remains</tspan></text><rect x="42" y="696" width="1515" height="76" rx="8" fill="#FFF4E4"/><text x="58" y="724" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B66D12" text-anchor="start"><tspan x="58" dy="0">Object Lock protects retained versions. A newer version or delete marker can change what current reads return; verification detects that</tspan><tspan x="58" dy="25.0">difference.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>