<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow-app" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#235A83"/></marker><marker id="arrow-control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#167A69"/></marker><marker id="arrow-data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7251A1"/></marker><marker id="arrow-gate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B66D12"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#B94B46"/></marker><marker id="arrow-plain" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#687788"/></marker></defs><rect width="1600" height="820" fill="white"/><rect x="35" y="110" width="1530" height="245" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="55" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="55" dy="0">TRACE PATH  |  PUSH</tspan></text><rect x="35" y="410" width="1530" height="245" rx="18" fill="#FCFDFE" stroke="#AABCC9" stroke-width="2" stroke-dasharray="8 7"/><text x="55" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#526C80" text-anchor="start"><tspan x="55" dy="0">METRIC PATH  |  PULL</tspan></text><path d="M 465,238 L 600,238" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="499.0" y="196" width="68" height="26" rx="5" fill="white"/><text x="533" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="533" dy="0">spans</tspan></text><path d="M 965,238 L 1105,238" fill="none" stroke="#687788" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-plain)"/><rect x="996.0" y="196" width="78" height="26" rx="5" fill="white"/><text x="1035" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#687788" text-anchor="middle"><tspan x="1035" dy="0">export</tspan></text><path d="M 600,538 L 465,538" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="494.0" y="496" width="78" height="26" rx="5" fill="white"/><text x="533" y="516" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="533" dy="0">scrape</tspan></text><path d="M 1105,538 L 965,538" fill="none" stroke="#167A69" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-control)"/><rect x="1001.0" y="496" width="68" height="26" rx="5" fill="white"/><text x="1035" y="516" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#167A69" text-anchor="middle"><tspan x="1035" dy="0">query</tspan></text><text x="42" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21384B" text-anchor="start"><tspan x="42" dy="0">Two telemetry paths explain individual calls and aggregate activity</tspan></text><rect x="65" y="170" width="400" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="83" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="83" dy="0">Backend instrumentation</tspan></text><text x="83" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="83" dy="0">FastAPI and outgoing requests</tspan><tspan x="83" dy="25.0">LLM spans with token usage</tspan></text><rect x="600" y="170" width="365" height="135" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="618" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="618" dy="0">OpenTelemetry exporter</tspan></text><text x="618" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="618" dy="0">Batch spans over OTLP HTTP</tspan><tspan x="618" dy="25.0">Authenticated local endpoint</tspan></text><rect x="1105" y="170" width="405" height="135" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="1123" y="202" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="1123" dy="0">Self hosted Langfuse</tspan></text><text x="1123" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1123" dy="0">Trace ingestion and exploration</tspan><tspan x="1123" dy="25.0">Worker, ClickHouse and Redis</tspan></text><rect x="65" y="470" width="400" height="135" rx="12" fill="#EEF4FA" stroke="#235A83" stroke-width="2"/><text x="83" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#235A83" text-anchor="start"><tspan x="83" dy="0">Scrape targets</tspan></text><text x="83" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="83" dy="0">policy-service /metrics</tspan><tspan x="83" dy="25.0">LiteLLM /metrics</tspan></text><rect x="600" y="470" width="365" height="135" rx="12" fill="#F3F0FA" stroke="#7251A1" stroke-width="2"/><text x="618" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7251A1" text-anchor="start"><tspan x="618" dy="0">Prometheus</tspan></text><text x="618" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="618" dy="0">Scrape every 15 seconds</tspan><tspan x="618" dy="25.0">Store time series</tspan></text><rect x="1105" y="470" width="405" height="135" rx="12" fill="#EAF7F3" stroke="#167A69" stroke-width="2"/><text x="1123" y="502" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#167A69" text-anchor="start"><tspan x="1123" dy="0">Grafana</tspan></text><text x="1123" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#263D50" text-anchor="start"><tspan x="1123" dy="0">Query and visualize metrics</tspan><tspan x="1123" dy="25.0">Unified alerting configuration</tspan></text><rect x="42" y="695" width="1515" height="76" rx="8" fill="#FFF4E4"/><text x="58" y="723" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#B66D12" text-anchor="start"><tspan x="58" dy="0">The source report validates gateway budget enforcement. Separate trace and dashboard scenario files are missing; illustrative dashboard</tspan><tspan x="58" dy="25.0">values are not test measurements.</tspan></text><circle cx="45" cy="787" r="6" fill="#235A83"/><text x="60" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="60" dy="0">Application</tspan></text><circle cx="345" cy="787" r="6" fill="#167A69"/><text x="360" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="360" dy="0">Control</tspan></text><circle cx="645" cy="787" r="6" fill="#7251A1"/><text x="660" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="660" dy="0">Data or storage</tspan></text><circle cx="945" cy="787" r="6" fill="#B66D12"/><text x="960" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="960" dy="0">Decision or condition</tspan></text><circle cx="1245" cy="787" r="6" fill="#B94B46"/><text x="1260" y="794" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start"><tspan x="1260" dy="0">Stop or limitation</tspan></text></svg>